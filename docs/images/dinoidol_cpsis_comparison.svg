<text id="text-24" x="48" y="981" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#53647c">DINO / MaskDINO detection models and the DINOv2 feature backbone are distinct model families.</text>
