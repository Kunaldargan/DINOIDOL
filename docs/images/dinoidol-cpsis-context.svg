<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">DINOIDOL and CP-SIS context</title>
  <desc id="desc">A comparison diagram showing DINOIDOL's temporal video instance segmentation path, CP-SIS's class prototype segmentation path, and a future unimplemented bridge between prototype classification and online tracking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#020617" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9a8d4"/>
    </marker>
    <style>
      .title { font: 700 28px Inter, Segoe UI, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 15px Inter, Segoe UI, sans-serif; fill: #cbd5e1; }
      .head { font: 700 18px Inter, Segoe UI, sans-serif; fill: #0f172a; }
      .body { font: 400 13px Inter, Segoe UI, sans-serif; fill: #1e293b; }
      .tag { font: 700 12px Inter, Segoe UI, sans-serif; fill: #475569; letter-spacing: 0.7px; }
      .foot { font: 600 12px Inter, Segoe UI, sans-serif; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="54" y="56" class="title">Two complementary views of surgical instrument segmentation</text>
  <text x="54" y="84" class="subtitle">DINOIDOL contributes temporal association; CP-SIS emphasizes class-level separation</text>

  <g filter="url(#shadow)">
    <rect x="54" y="126" width="515" height="310" rx="22" fill="#e0f2fe"/>
    <rect x="54" y="126" width="515" height="58" rx="22" fill="#bae6fd"/>
    <rect x="54" y="162" width="515" height="22" fill="#bae6fd"/>
    <text x="82" y="163" class="head">DINOIDOL</text>
    <text x="82" y="208" class="tag">VIDEO INSTANCE SEGMENTATION</text>

    <rect x="82" y="232" width="140" height="70" rx="14" fill="#ffffff"/>
    <text x="105" y="260" class="body">MaskDINO</text>
    <text x="105" y="281" class="body">queries + masks</text>
    <path d="M222 267 H264" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow-blue)"/>

    <rect x="264" y="232" width="140" height="70" rx="14" fill="#ffffff"/>
    <text x="287" y="260" class="body">IDOL</text>
    <text x="287" y="281" class="body">online tracker</text>
    <path d="M404 267 H446" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow-blue)"/>

    <rect x="446" y="232" width="95" height="70" rx="14" fill="#bbf7d0"/>
    <text x="462" y="260" class="body">tracked</text>
    <text x="462" y="281" class="body">instances</text>

    <text x="82" y="346" class="body">Strength: frame-to-frame identity and temporal mask continuity.</text>
    <text x="82" y="375" class="body">Output: class labels, masks, and tracklets across a video.</text>
    <text x="82" y="404" class="body">Repository path: `projects/IDOL/`</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="631" y="126" width="515" height="310" rx="22" fill="#fce7f3"/>
    <rect x="631" y="126" width="515" height="58" rx="22" fill="#fbcfe8"/>
    <rect x="631" y="162" width="515" height="22" fill="#fbcfe8"/>
    <text x="659" y="163" class="head">CP-SIS</text>
    <text x="659" y="208" class="tag">CLASS-AWARE FRAME SEGMENTATION</text>

    <rect x="659" y="232" width="140" height="70" rx="14" fill="#ffffff"/>
    <text x="682" y="260" class="body">DINOv2</text>
    <text x="682" y="281" class="body">visual features</text>
    <path d="M799 267 H841" stroke="#f9a8d4" stroke-width="3" marker-end="url(#arrow-pink)"/>

    <rect x="841" y="232" width="140" height="70" rx="14" fill="#ffffff"/>
    <text x="862" y="260" class="body">class prototypes</text>
    <text x="862" y="281" class="body">query guidance</text>
    <path d="M981 267 H1023" stroke="#f9a8d4" stroke-width="3" marker-end="url(#arrow-pink)"/>

    <rect x="1023" y="232" width="95" height="70" rx="14" fill="#fbcfe8"/>
    <text x="1038" y="260" class="body">class-aware</text>
    <text x="1038" y="281" class="body">masks</text>

    <text x="659" y="346" class="body">Strength: class discrimination under domain shift and imbalance.</text>
    <text x="659" y="375" class="body">Efficiency: parameter-efficient adaptation with LoRA.</text>
    <text x="659" y="404" class="body">Reference: CP-SIS paper and public implementation.</text>
  </g>

  <path d="M569 455 C650 488 746 488 831 455" stroke="#f9a8d4" stroke-width="2.5" stroke-dasharray="8 8" fill="none" marker-end="url(#arrow-pink)"/>
  <rect x="385" y="461" width="430" height="45" rx="22" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="421" y="489" class="foot">Future design direction — prototype classifier + IDOL tracking</text>
  <text x="54" y="536" class="foot">The bridge is intentionally marked as unimplemented in this repository.</text>
</svg>
